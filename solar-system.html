<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System · 3D Interactive</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;user-select:none}
  canvas{display:block}

  #ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}

  #title{position:absolute;top:28px;left:32px;font-size:.75rem;letter-spacing:.55em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:300}

  #speed-box{position:absolute;bottom:32px;left:32px;display:flex;flex-direction:column;gap:7px}
  #slabel{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.28)}
  #sslider{-webkit-appearance:none;width:130px;height:1px;background:rgba(255,255,255,.15);outline:none;cursor:pointer;pointer-events:all}
  #sslider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#c0392b;cursor:pointer}
  #sval{font-size:.56rem;color:rgba(255,255,255,.22);letter-spacing:.15em}

  #hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.18);white-space:nowrap;transition:opacity .4s}

  #back{position:absolute;top:28px;right:32px;padding:9px 22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.45);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;pointer-events:all;opacity:0;transition:opacity .3s,background .2s,color .2s;font-family:inherit}
  #back.on{opacity:1}
  #back:hover{background:rgba(255,255,255,.09);color:#fff}

  #info{position:absolute;right:32px;top:50%;transform:translateY(-50%) translateX(14px);width:260px;background:rgba(4,3,7,.92);border:1px solid rgba(255,255,255,.07);padding:32px 28px;backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s cubic-bezier(.4,0,.2,1)}
  #info.on{opacity:1;transform:translateY(-50%) translateX(0);pointer-events:all}
  #iname{font-size:2.3rem;font-weight:300;line-height:1;margin-bottom:4px;letter-spacing:-.01em}
  #itype{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:#c0392b;margin-bottom:24px}
  .irow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.71rem;gap:10px}
  .ik{color:rgba(255,255,255,.32);flex-shrink:0}
  .iv{color:rgba(255,255,255,.8);font-weight:500;text-align:right}
  #iclose{position:absolute;top:12px;right:14px;background:none;border:none;color:rgba(255,255,255,.22);font-size:1.2rem;cursor:pointer;pointer-events:all;transition:color .2s;font-family:inherit}
  #iclose:hover{color:#fff}

  #pname{position:absolute;background:rgba(0,0,0,.6);padding:5px 12px;border-radius:2px;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.8);pointer-events:none;opacity:0;transition:opacity .2s;border:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">Solar System</div>
  <div id="speed-box">
    <div id="slabel">Orbital Speed</div>
    <input id="sslider" type="range" min="0" max="8" step=".1" value="1.5">
    <div id="sval">1.5×</div>
  </div>
  <div id="hint">Click a planet to explore · Scroll to zoom · Drag to pan</div>
  <button id="back">← Overview</button>
  <div id="info">
    <button id="iclose">×</button>
    <div id="iname">Earth</div>
    <div id="itype">Terrestrial Planet</div>
    <div id="ibody"></div>
  </div>
  <div id="pname"></div>
</div>

<script>
// ─── Math ──────────────────────────────────────────────────────
const PI=Math.PI,TAU=PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// ─── Canvas ────────────────────────────────────────────────────
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight;
cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
cv.style.width=W+'px';cv.style.height=H+'px';
ctx.scale(devicePixelRatio,devicePixelRatio);

window.addEventListener('resize',()=>{
  W=innerWidth;H=innerHeight;
  cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);
  buildStars();
});

// ─── Stars ─────────────────────────────────────────────────────
let stars=[];
function buildStars(){
  stars=[];
  for(let i=0;i<900;i++){
    const r=Math.random();
    stars.push({x:Math.random()*W,y:Math.random()*H,r:r<.7?.5:r<.9?1:1.5,a:lerp(.3,1,Math.random()),
      hue:Math.random()<.15?Math.random()*60+200:0});
  }
}
buildStars();

// ─── Camera ────────────────────────────────────────────────────
const cam={x:0,y:0,zoom:1,tx:0,ty:0,tz:1,tweening:false,tp:0};
const TILT=.42;

function toScreen(wx,wy){
  return[(wx-cam.x)*cam.zoom+W/2,(wy-cam.y)*cam.zoom*TILT+H/2];
}
function fromScreen(sx,sy){
  return[(sx-W/2)/cam.zoom+cam.x,(sy-H/2)/cam.zoom/TILT+cam.y];
}
function startCamTween(tx,ty,tz){
  cam.fx=cam.x;cam.fy=cam.y;cam.fz=cam.zoom;
  cam.tx=tx;cam.ty=ty;cam.tz=tz;cam.tweening=true;cam.tp=0;
}

// ─── Planet data ───────────────────────────────────────────────
const PLANETS=[
  {name:'Mercury',type:'Terrestrial Planet',dist:95,spd:4.74,r:5,
   colors:{bg:'#a09080',light:'#d4c8b8',mid:'#a09080',dark:'#3a3028',glow:null},
   info:{'Diameter':'4,879 km','Day':'58.6 Earth days','Year':'88 Earth days','Moons':'0','Temp':'-180 to 430°C'}},
  {name:'Venus',type:'Terrestrial Planet',dist:145,spd:1.82,r:8,
   colors:{bg:'#d4b870',light:'#f0d898',mid:'#c8a850',dark:'#6a5010',glow:'rgba(255,200,80,.12)'},
   info:{'Diameter':'12,104 km','Day':'243 Earth days','Year':'225 Earth days','Moons':'0','Temp':'462°C avg'}},
  {name:'Earth',type:'Terrestrial Planet',dist:200,spd:1.00,r:8.5,
   colors:{bg:'#2a6bbf',light:'#5a9cdf',mid:'#1a5aaa',dark:'#0a1a3a',glow:'rgba(60,140,255,.14)'},
   extra:'earth',
   info:{'Diameter':'12,742 km','Day':'24 hours','Year':'365.25 days','Moons':'1','Temp':'-88 to 58°C'}},
  {name:'Mars',type:'Terrestrial Planet',dist:265,spd:0.53,r:6.5,
   colors:{bg:'#c0501a',light:'#e07040',mid:'#b04010',dark:'#3a1008',glow:'rgba(200,80,30,.12)'},
   info:{'Diameter':'6,779 km','Day':'24.6 hours','Year':'687 Earth days','Moons':'2','Temp':'-153 to 20°C'}},
  {name:'Jupiter',type:'Gas Giant',dist:400,spd:.084,r:28,
   colors:{bg:'#c08040',light:'#e0b060',mid:'#b07030',dark:'#3a1a08',glow:'rgba(200,140,60,.10)'},
   extra:'jupiter',
   info:{'Diameter':'139,820 km','Day':'9.9 hours','Year':'11.9 Earth years','Moons':'95','Temp':'-145°C avg'}},
  {name:'Saturn',type:'Gas Giant',dist:550,spd:.034,r:23,
   colors:{bg:'#c0a060',light:'#dcc080',mid:'#a88040',dark:'#382808',glow:'rgba(210,170,80,.10)'},
   rings:true,
   info:{'Diameter':'116,460 km','Day':'10.7 hours','Year':'29.4 Earth years','Moons':'146','Temp':'-178°C avg'}},
  {name:'Uranus',type:'Ice Giant',dist:700,spd:.012,r:16,
   colors:{bg:'#4ec8c8',light:'#7ee0e0',mid:'#38b0b0',dark:'#0a3030',glow:'rgba(80,210,210,.10)'},
   info:{'Diameter':'50,724 km','Day':'17.2 hours','Year':'84 Earth years','Moons':'27','Temp':'-224°C avg'}},
  {name:'Neptune',type:'Ice Giant',dist:840,spd:.006,r:15,
   colors:{bg:'#1a3ab0',light:'#3060d0',mid:'#1428a0',dark:'#050a28',glow:'rgba(30,80,220,.12)'},
   info:{'Diameter':'49,244 km','Day':'16.1 hours','Year':'164.8 Earth years','Moons':'16','Temp':'-218°C avg'}},
];

// ─── Angles ────────────────────────────────────────────────────
PLANETS.forEach(p=>{p.angle=Math.random()*TAU;});

// ─── Draw helpers ──────────────────────────────────────────────
function sphere(x,y,r,c){
  // Shadow on ground
  ctx.save();
  ctx.translate(x,y+r*.85);
  ctx.scale(1,.25);
  const sg=ctx.createRadialGradient(0,0,0,0,0,r*.95);
  sg.addColorStop(0,'rgba(0,0,0,.35)');sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(0,0,r*.95,0,TAU);ctx.fillStyle=sg;ctx.fill();
  ctx.restore();

  // Glow
  if(c.glow){
    const gg=ctx.createRadialGradient(x,y,r*.5,x,y,r*2.2);
    gg.addColorStop(0,c.glow);gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,TAU);ctx.fillStyle=gg;ctx.fill();
  }

  // Sphere gradient
  const lx=x-r*.35,ly=y-r*.35;
  const g=ctx.createRadialGradient(lx,ly,r*.05,x,y,r);
  g.addColorStop(0,c.light);
  g.addColorStop(.45,c.mid);
  g.addColorStop(.8,c.bg);
  g.addColorStop(1,c.dark);
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=g;ctx.fill();

  // Terminator (night side dark)
  const tg=ctx.createRadialGradient(x+r*.3,y,0,x+r*.3,y,r*1.2);
  tg.addColorStop(0,'rgba(0,0,0,0)');tg.addColorStop(.6,'rgba(0,0,0,0)');
  tg.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=tg;ctx.fill();

  // Specular highlight
  const sl=ctx.createRadialGradient(lx,ly,0,lx,ly,r*.45);
  sl.addColorStop(0,'rgba(255,255,255,.28)');sl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=sl;ctx.fill();
}

function drawEarth(x,y,r,angle){
  sphere(x,y,r,PLANETS[2].colors);
  // Land masses (rough shapes)
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  ctx.globalAlpha=.55;
  const land=[
    [-.2,-.3,.25,.4],[.05,-.35,.18,.3],[-.35,.1,.2,.35],
    [.1,.0,.22,.28],[-.1,.25,.15,.22],[.3,-.1,.12,.18],
  ];
  land.forEach(([dx,dy,w,h])=>{
    const g=ctx.createRadialGradient(x+dx*r,y+dy*r,0,x+dx*r,y+dy*r,w*r);
    g.addColorStop(0,'rgba(40,120,40,.9)');g.addColorStop(1,'rgba(40,120,40,0)');
    ctx.beginPath();ctx.ellipse(x+dx*r,y+dy*r,w*r,h*r,0,0,TAU);ctx.fillStyle=g;ctx.fill();
  });
  // Clouds
  ctx.globalAlpha=.35;
  [[-.1,-.2,.3],[.2,.1,.25],[-.3,.05,.2],[.05,-.4,.22]].forEach(([dx,dy,s])=>{
    const g=ctx.createRadialGradient(x+dx*r,y+dy*r,0,x+dx*r,y+dy*r,s*r);
    g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();ctx.ellipse(x+dx*r,y+dy*r,s*r,s*r*.5,0,0,TAU);ctx.fillStyle=g;ctx.fill();
  });
  ctx.globalAlpha=1;ctx.restore();
}

function drawJupiter(x,y,r){
  sphere(x,y,r,PLANETS[4].colors);
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  const bands=[
    ['rgba(180,100,30,.5)',-.45,.12],['rgba(230,180,90,.4)',-.30,.1],
    ['rgba(160,80,20,.45)',-.18,.09],['rgba(230,200,120,.35)',-.08,.11],
    ['rgba(200,120,40,.4)',.04,.1],['rgba(155,75,20,.45)',.15,.09],
    ['rgba(220,180,100,.4)',.27,.1],['rgba(175,95,30,.4)',.40,.12],
  ];
  bands.forEach(([col,dy,h])=>{
    ctx.fillStyle=col;ctx.fillRect(x-r,y+dy*r*2-h*r,r*2,h*r*2);
  });
  // GRS
  const gg=ctx.createRadialGradient(x+r*.2,y+r*.15,0,x+r*.2,y+r*.15,r*.22);
  gg.addColorStop(0,'rgba(180,50,30,.7)');gg.addColorStop(1,'rgba(180,50,30,0)');
  ctx.save();ctx.translate(x+r*.2,y+r*.15);ctx.scale(1.8,1);
  ctx.beginPath();ctx.arc(0,0,r*.22,0,TAU);ctx.fillStyle=gg;ctx.fill();ctx.restore();
  ctx.globalAlpha=1;ctx.restore();
}

function drawSaturnRings(x,y,r,zoom){
  const rx=r*2.5*zoom,ry=rx*TILT;
  // Back half (behind planet)
  ctx.save();
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,PI,TAU);
  ctx.strokeStyle='rgba(0,0,0,0)';ctx.stroke();
  for(let i=0;i<8;i++){
    const t=i/8,rxi=lerp(r*1.3,r*2.5,t)*zoom,ryi=rxi*TILT;
    const a=lerp(.05,.5,t>0.3&&t<0.55?0:t);
    const col=`rgba(${Math.floor(lerp(150,210,t))},${Math.floor(lerp(120,175,t))},${Math.floor(lerp(80,110,t))},${a})`;
    ctx.beginPath();ctx.ellipse(x,y,rxi,ryi,0,PI,TAU);
    ctx.lineWidth=lerp(1,r*.18,t)*zoom;ctx.strokeStyle=col;ctx.stroke();
  }
  ctx.restore();
}
function drawSaturnRingsFront(x,y,r,zoom){
  for(let i=0;i<8;i++){
    const t=i/8,rxi=lerp(r*1.3,r*2.5,t)*zoom,ryi=rxi*TILT;
    const a=lerp(.05,.5,t>0.3&&t<0.55?0:t);
    const col=`rgba(${Math.floor(lerp(150,210,t))},${Math.floor(lerp(120,175,t))},${Math.floor(lerp(80,110,t))},${a})`;
    ctx.beginPath();ctx.ellipse(x,y,rxi,ryi,0,0,PI);
    ctx.lineWidth=lerp(1,r*.18,t)*zoom;ctx.strokeStyle=col;ctx.stroke();
  }
}

// ─── Asteroid belt ─────────────────────────────────────────────
const asteroids=[];
for(let i=0;i<1200;i++){
  const d=lerp(310,360,Math.random()),a=Math.random()*TAU;
  asteroids.push({d,a,size:Math.random()<.8?.5:1,alpha:lerp(.2,.7,Math.random())});
}

// ─── State ─────────────────────────────────────────────────────
let speed=1.5,selected=null,zoomed=false;
let isDragging=false,dragStart={x:0,y:0},camAtDrag={x:0,y:0};
let hovered=null;

document.getElementById('sslider').addEventListener('input',e=>{
  speed=parseFloat(e.target.value);
  document.getElementById('sval').textContent=speed.toFixed(1)+'×';
});

function showInfo(pd){
  document.getElementById('iname').textContent=pd.name;
  document.getElementById('itype').textContent=pd.type;
  const body=document.getElementById('ibody');body.innerHTML='';
  for(const [k,v] of Object.entries(pd.info)){
    const r=document.createElement('div');r.className='irow';
    r.innerHTML=`<span class="ik">${k}</span><span class="iv">${v}</span>`;body.appendChild(r);
  }
  document.getElementById('info').classList.add('on');
  document.getElementById('back').classList.add('on');
  document.getElementById('hint').style.opacity='0';
}
function hideInfo(){
  document.getElementById('info').classList.remove('on');
  document.getElementById('back').classList.remove('on');
  document.getElementById('hint').style.opacity='1';
}

function zoomTo(pd){
  selected=pd;zoomed=true;showInfo(pd);
  startCamTween(pd.wx,pd.wy,Math.min(W,H)/(pd.r*10));
}
function resetView(){
  selected=null;zoomed=false;hideInfo();
  startCamTween(0,0,1);
}

document.getElementById('back').addEventListener('click',resetView);
document.getElementById('iclose').addEventListener('click',resetView);

// ─── Input ─────────────────────────────────────────────────────
function getHit(sx,sy){
  for(const pd of PLANETS){
    if(pd.wx===undefined)continue;
    const [px2,py2]=toScreen(pd.wx,pd.wy);
    const sr=pd.r*cam.zoom;
    if(Math.hypot(sx-px2,sy-py2)<sr*1.4)return pd;
  }
  return null;
}

let mouseX=0,mouseY=0,mouseDown=false,didDrag=false,mdX=0,mdY=0;

cv.addEventListener('mousedown',e=>{
  mouseDown=true;didDrag=false;
  mdX=e.clientX;mdY=e.clientY;
  camAtDrag={x:cam.x,y:cam.y};
});
cv.addEventListener('mousemove',e=>{
  mouseX=e.clientX;mouseY=e.clientY;
  if(mouseDown){
    const dx=e.clientX-mdX,dy=e.clientY-mdY;
    if(Math.hypot(dx,dy)>4){
      didDrag=true;
      cam.x=camAtDrag.x-dx/cam.zoom;
      cam.y=camAtDrag.y-dy/cam.zoom/TILT;
    }
  }
  const h=getHit(e.clientX,e.clientY);
  hovered=h;
  const pn=document.getElementById('pname');
  if(h){
    cv.style.cursor='pointer';
    pn.textContent=h.name;
    pn.style.left=(e.clientX+16)+'px';pn.style.top=(e.clientY-8)+'px';
    pn.style.opacity='1';
  }else{cv.style.cursor=mouseDown?'grabbing':'grab';pn.style.opacity='0';}
});
cv.addEventListener('mouseup',e=>{
  mouseDown=false;
  if(!didDrag){
    const h=getHit(e.clientX,e.clientY);
    if(h)zoomTo(h);else if(zoomed)resetView();
  }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY>0?.88:1.14;
  const [wx,wy]=fromScreen(e.clientX,e.clientY);
  cam.zoom=clamp(cam.zoom*factor,.3,12);
  // Zoom toward cursor
  const [nx,ny]=fromScreen(e.clientX,e.clientY);
  cam.x+=wx-nx;cam.y+=wy-ny;
},{passive:false});

// Touch
let lastTouchDist=0,touchStart={x:0,y:0},touchCamStart={x:0,y:0},touchDidMove=false;
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  touchDidMove=false;
  if(e.touches.length===1){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};touchCamStart={x:cam.x,y:cam.y};}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastTouchDist=Math.hypot(dx,dy);}
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();touchDidMove=true;
  if(e.touches.length===1){
    const dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;
    cam.x=touchCamStart.x-dx/cam.zoom;cam.y=touchCamStart.y-dy/cam.zoom/TILT;
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    cam.zoom=clamp(cam.zoom*(dist/lastTouchDist),.3,12);lastTouchDist=dist;
  }
},{passive:false});
cv.addEventListener('touchend',e=>{
  if(!touchDidMove&&e.changedTouches.length===1){
    const t=e.changedTouches[0],h=getHit(t.clientX,t.clientY);
    if(h)zoomTo(h);else if(zoomed)resetView();
  }
},{passive:false});

// ─── Render ────────────────────────────────────────────────────
let T=0,lastT=0;

function draw(ts){
  requestAnimationFrame(draw);
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;T+=dt;

  // Camera tween
  if(cam.tweening){
    cam.tp=Math.min(cam.tp+dt*1.4,1);const t=eio(cam.tp);
    cam.x=lerp(cam.fx,cam.tx,t);
    cam.y=lerp(cam.fy,cam.ty,t);
    cam.zoom=lerp(cam.fz,cam.tz,t);
    if(cam.tp>=1)cam.tweening=false;
  }

  // Follow selected
  if(zoomed&&selected&&!cam.tweening){
    cam.x=lerp(cam.x,selected.wx,.06);
    cam.y=lerp(cam.y,selected.wy,.06);
  }

  // Update planet positions
  PLANETS.forEach(p=>{
    p.angle+=p.spd*0.008*speed*dt;
    p.wx=Math.cos(p.angle)*p.dist;
    p.wy=Math.sin(p.angle)*p.dist;
  });

  // ── Draw ──
  ctx.clearRect(0,0,W,H);

  // Sky gradient
  const sky=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.8);
  sky.addColorStop(0,'#04030a');sky.addColorStop(1,'#000000');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(s=>{
    ctx.globalAlpha=s.a*(0.7+0.3*Math.sin(T*.8+s.x));
    ctx.fillStyle=s.hue?`hsl(${s.hue},60%,80%)`:'#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Sun glow
  const [sx,sy]=toScreen(0,0);
  const sunR=52*cam.zoom;
  [[3.5,.04],[2.5,.07],[1.8,.12],[1.35,.2]].forEach(([s,a])=>{
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,sunR*s);
    g.addColorStop(0,`rgba(255,180,50,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(sx,sy,sunR*s,0,TAU);ctx.fillStyle=g;ctx.fill();
  });

  // Orbit paths
  PLANETS.forEach(p=>{
    ctx.beginPath();
    ctx.ellipse(sx,sy,p.dist*cam.zoom,p.dist*cam.zoom*TILT,0,0,TAU);
    ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=1;ctx.stroke();
  });

  // Asteroid belt
  asteroids.forEach(a=>{
    const wx=Math.cos(a.a)*a.d,wy=Math.sin(a.a)*a.d;
    const [ax,ay]=toScreen(wx,wy);
    ctx.globalAlpha=a.alpha*.6;
    ctx.fillStyle='#998866';
    ctx.beginPath();ctx.arc(ax,ay,a.size*cam.zoom,0,TAU);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Saturn rings (back)
  const satPd=PLANETS[5];
  if(satPd.wx!==undefined){
    const [satX,satY]=toScreen(satPd.wx,satPd.wy);
    drawSaturnRings(satX,satY,satPd.r,cam.zoom);
  }

  // Sun
  const sunG=ctx.createRadialGradient(sx-sunR*.3,sy-sunR*.3,sunR*.1,sx,sy,sunR);
  sunG.addColorStop(0,'#fff8e0');sunG.addColorStop(.3,'#ffe060');sunG.addColorStop(.7,'#ff9010');sunG.addColorStop(1,'#c04000');
  ctx.beginPath();ctx.arc(sx,sy,sunR,0,TAU);ctx.fillStyle=sunG;ctx.fill();
  // Corona
  const cg=ctx.createRadialGradient(sx,sy,sunR*.9,sx,sy,sunR*1.08);
  cg.addColorStop(0,'rgba(255,200,50,.3)');cg.addColorStop(1,'rgba(255,150,20,0)');
  ctx.beginPath();ctx.arc(sx,sy,sunR*1.08,0,TAU);ctx.fillStyle=cg;ctx.fill();

  // Planets (sorted by Y for depth)
  const sorted=[...PLANETS].sort((a,b)=>a.wy-b.wy);
  sorted.forEach(pd=>{
    if(pd.wx===undefined)return;
    const [px2,py2]=toScreen(pd.wx,pd.wy);
    const sr=pd.r*cam.zoom;

    if(pd.name==='Saturn'){
      sphere(px2,py2,sr,pd.colors);
      drawSaturnRingsFront(px2,py2,pd.r,cam.zoom);
    }else if(pd.extra==='earth'){
      drawEarth(px2,py2,sr,pd.angle);
    }else if(pd.extra==='jupiter'){
      drawJupiter(px2,py2,sr);
    }else{
      sphere(px2,py2,sr,pd.colors);
    }

    // Moon for Earth
    if(pd.name==='Earth'){
      const mAngle=pd.angle*13;
      const mDist=sr*1.8;
      const mx=px2+Math.cos(mAngle)*mDist*1.5;
      const my=py2+Math.sin(mAngle)*mDist*TILT;
      const mr=sr*.27;
      const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);
      mg.addColorStop(0,'#ddd');mg.addColorStop(.5,'#aaa');mg.addColorStop(1,'#555');
      ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fillStyle=mg;ctx.fill();
    }

    // Selection ring
    if(selected&&selected.name===pd.name){
      ctx.beginPath();ctx.arc(px2,py2,sr*1.35,0,TAU);
      ctx.strokeStyle='rgba(192,57,43,.6)';ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.stroke();
      ctx.setLineDash([]);
      // Outer pulse
      const pulse=1+Math.sin(T*3)*.06;
      ctx.beginPath();ctx.arc(px2,py2,sr*1.5*pulse,0,TAU);
      ctx.strokeStyle='rgba(192,57,43,.2)';ctx.lineWidth=1;ctx.stroke();
    }

    // Hover
    if(hovered&&hovered.name===pd.name&&(!selected||selected.name!==pd.name)){
      ctx.beginPath();ctx.arc(px2,py2,sr*1.3,0,TAU);
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Planet labels (overview mode)
  if(cam.zoom<1.8&&!zoomed){
    PLANETS.forEach(pd=>{
      if(pd.wx===undefined)return;
      const [px2,py2]=toScreen(pd.wx,pd.wy);
      const sr=pd.r*cam.zoom;
      ctx.font=`300 ${Math.max(9,10*cam.zoom)}px 'Segoe UI',sans-serif`;
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.textAlign='center';
      ctx.fillText(pd.name,px2,py2+sr+14*cam.zoom);
    });
  }
}

requestAnimationFrame(draw);
</script>
</body>
</html>
