<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System · 3D Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; color:#fff; font-family:'Space Grotesk',sans-serif; }
  canvas { display:block; }

  #loading {
    position:fixed; inset:0; z-index:100; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    transition:opacity 1s ease;
  }
  #loading.done { opacity:0; pointer-events:none; }
  .load-title { font-family:'Cormorant Garamond',serif; font-size:1.3rem; font-weight:300; letter-spacing:0.6em; color:rgba(255,255,255,0.5); text-transform:uppercase; }
  .load-bar-wrap { width:180px; height:1px; background:rgba(255,255,255,0.1); }
  .load-bar { height:1px; background:#c0392b; width:0; transition:width 0.15s; }

  #hud { position:fixed; top:28px; left:28px; z-index:10; }
  #hud-title { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:300; letter-spacing:0.55em; color:rgba(255,255,255,0.45); text-transform:uppercase; margin-bottom:24px; }
  #speed-label { font-size:0.58rem; letter-spacing:0.28em; text-transform:uppercase; color:rgba(255,255,255,0.28); margin-bottom:8px; }
  #speed-slider { -webkit-appearance:none; width:130px; height:1px; background:rgba(255,255,255,0.12); outline:none; cursor:pointer; display:block; }
  #speed-slider::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:#c0392b; cursor:pointer; }
  #speed-val { font-size:0.56rem; color:rgba(255,255,255,0.22); letter-spacing:0.15em; margin-top:6px; }

  #back-btn {
    position:fixed; top:28px; right:28px; z-index:10;
    padding:9px 20px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.45); font-family:'Space Grotesk',sans-serif;
    font-size:0.6rem; letter-spacing:0.22em; text-transform:uppercase; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity 0.3s, background 0.2s, color 0.2s;
  }
  #back-btn.on { opacity:1; pointer-events:all; }
  #back-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }

  #info {
    position:fixed; right:28px; top:50%; transform:translateY(-50%) translateX(14px); z-index:10;
    width:258px; background:rgba(5,4,8,0.9); border:1px solid rgba(255,255,255,0.07);
    padding:32px 28px; backdrop-filter:blur(18px);
    opacity:0; pointer-events:none;
    transition:opacity 0.45s, transform 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  #info.on { opacity:1; pointer-events:all; transform:translateY(-50%) translateX(0); }
  #info-name { font-family:'Cormorant Garamond',serif; font-size:2.4rem; font-weight:300; line-height:1; color:#fff; margin-bottom:4px; }
  #info-type { font-size:0.58rem; letter-spacing:0.3em; text-transform:uppercase; color:#c0392b; margin-bottom:24px; }
  .irow { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.71rem; gap:10px; }
  .ik { color:rgba(255,255,255,0.32); flex-shrink:0; }
  .iv { color:rgba(255,255,255,0.8); font-weight:500; text-align:right; }
  #info-x { position:absolute; top:12px; right:14px; background:none; border:none; color:rgba(255,255,255,0.22); font-size:1.2rem; cursor:pointer; transition:color 0.2s; }
  #info-x:hover { color:#fff; }

  #hint { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); font-size:0.58rem; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.18); white-space:nowrap; z-index:10; transition:opacity 0.4s; }
</style>
</head>
<body>

<div id="loading">
  <div class="load-title">Solar System</div>
  <div class="load-bar-wrap"><div class="load-bar" id="lbar"></div></div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="hud-title">Solar System</div>
  <div id="speed-label">Orbital Speed</div>
  <input id="speed-slider" type="range" min="0" max="8" step="0.1" value="1.5">
  <div id="speed-val">1.5×</div>
</div>

<button id="back-btn">← Overview</button>

<div id="info">
  <button id="info-x">×</button>
  <div id="info-name">Earth</div>
  <div id="info-type">Terrestrial Planet</div>
  <div id="info-body"></div>
</div>

<div id="hint">Click a planet to explore · Scroll to zoom · Drag to orbit</div>

<script>
// ── Helpers ───────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t;}
function eio(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}

function noise(x,y,s){const n=Math.sin(x*127.1+y*311.7+s*74.9)*43758.5453;return n-Math.floor(n);}
function snoise(x,y,s){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return noise(ix,iy,s)*(1-ux)*(1-uy)+noise(ix+1,iy,s)*ux*(1-uy)+noise(ix,iy+1,s)*(1-ux)*uy+noise(ix+1,iy+1,s)*ux*uy;
}
function fbm(x,y,s,o){
  o=o||5;let v=0,a=0.5,f=1;
  for(let i=0;i<o;i++){v+=snoise(x*f,y*f,s+i*100)*a;a*=0.5;f*=2;}return v;
}
function makeTex(w,h,fn){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d'),id=ctx.createImageData(w,h);
  fn(id.data,w,h);ctx.putImageData(id,0,0);
  return new THREE.CanvasTexture(cv);
}
function px(d,i,r,g,b,a){d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=a===undefined?255:a;}

// Progress bar
function prog(p){document.getElementById('lbar').style.width=p+'%';}
function done(){setTimeout(()=>document.getElementById('loading').classList.add('done'),500);}

// ── Textures ──────────────────────────────────────────────────
prog(5);
const TEX={};

TEX.sun=makeTex(256,128,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*4,y/h*4,1,5);
    const i=(y*w+x)*4;
    px(d,i,255,Math.floor(lerp(80,210,n)),Math.floor(lerp(0,30,n)));
  }
});
prog(12);

TEX.mercury=makeTex(256,128,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*6,y/h*6,10,6),v=Math.floor(lerp(100,175,n)),i=(y*w+x)*4;
    px(d,i,v,Math.floor(v*0.97),Math.floor(v*0.92));
  }
  // craters via canvas after
});
prog(19);

TEX.venus=makeTex(256,128,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*3,y/h*3,20,5),i=(y*w+x)*4;
    px(d,i,Math.floor(lerp(185,240,n)),Math.floor(lerp(148,195,n)),Math.floor(lerp(65,108,n)));
  }
});
prog(27);

TEX.earth=makeTex(512,256,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const n=fbm(x/w*4.5,y/h*4.5,30,7);
    if(n>0.53){const t=(n-0.53)/0.47,g=Math.floor(lerp(60,145,t));px(d,i,Math.floor(g*0.42),g,Math.floor(g*0.3));}
    else{px(d,i,20,Math.floor(lerp(55,100,n)),Math.floor(lerp(130,190,n)));}
  }
  // clouds
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*7+12,y/h*5,40,4);
    if(n>0.58){const i=(y*w+x)*4,a=Math.floor((n-0.58)/0.42*200);
      d[i]=Math.min(255,d[i]+a);d[i+1]=Math.min(255,d[i+1]+a);d[i+2]=Math.min(255,d[i+2]+a);}
  }
  // ice caps
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*8,0,50)*10+5;
    if(y<n||y>h-n){const i=(y*w+x)*4;px(d,i,225,238,255);}
  }
});
prog(42);

TEX.mars=makeTex(256,128,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*5,y/h*5,60,6),i=(y*w+x)*4;
    px(d,i,Math.floor(lerp(155,215,n)),Math.floor(lerp(68,108,n)),Math.floor(lerp(40,65,n)));
  }
  for(let y=0;y<8;y++)for(let x=0;x<256;x++){const i=(y*256+x)*4;px(d,i,220,228,255);}
  for(let y=120;y<128;y++)for(let x=0;x<256;x++){const i=(y*256+x)*4;px(d,i,220,228,255);}
});
prog(52);

TEX.jupiter=makeTex(512,256,(d,w,h)=>{
  const bands=[[196,124,44],[217,168,92],[184,106,32],[232,200,112],[168,96,24],[212,152,80],[196,124,44],[223,192,128],[176,96,24],[200,128,64]];
  const bh=h/bands.length;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const bi=Math.floor(y/bh),n=fbm(x/w*9,bi*0.7,80+bi)*0.12;
    const fi=Math.min(bands.length-1,Math.max(0,Math.floor((y+n*bh*2)/bh)));
    const [r,g,b]=bands[fi],i=(y*w+x)*4;
    px(d,i,r,g,b);
  }
  // GRS
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(x-w*0.34)/24,dy=(y-h*0.61)/14,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<1){const a=Math.floor((1-dist)*200),i=(y*w+x)*4;
      d[i]=Math.min(255,d[i]*(1-a/255)+178*(a/255));d[i+1]=Math.floor(d[i+1]*(1-a/255)+54*(a/255));d[i+2]=Math.floor(d[i+2]*(1-a/255)+32*(a/255));}
  }
});
prog(63);

TEX.saturn=makeTex(256,128,(d,w,h)=>{
  const bands=[[192,160,96],[208,176,112],[176,128,80],[220,184,112],[168,112,64],[200,164,96],[216,176,120],[176,128,80]];
  const bh=h/bands.length;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const bi=Math.min(bands.length-1,Math.floor(y/bh));
    const [r,g,b]=bands[bi],i=(y*w+x)*4;px(d,i,r,g,b);
  }
});
TEX.rings=makeTex(512,1,(d,w)=>{
  for(let x=0;x<w;x++){
    const t=x/w;
    if(t<0.12||(t>0.38&&t<0.44)){px(d,x*4,0,0,0,0);continue;}
    const n=fbm(t*14,0,100)*0.55+0.28,v=Math.floor(lerp(138,205,n));
    px(d,x*4,v,Math.floor(v*0.87),Math.floor(v*0.63),Math.floor(Math.min(n,0.88)*255));
  }
});
prog(72);

TEX.uranus=makeTex(128,64,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*3,y/h*3,110)*0.18,i=(y*w+x)*4;
    px(d,i,Math.floor(68+n*28),Math.floor(200+n*26),Math.floor(198+n*20));
  }
});
TEX.neptune=makeTex(128,64,(d,w,h)=>{
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const n=fbm(x/w*4,y/h*4,120,5),i=(y*w+x)*4;
    px(d,i,Math.floor(lerp(18,46,n)),Math.floor(lerp(42,92,n)),Math.floor(lerp(168,238,n)));
  }
});
prog(82);

// ── Planet data ───────────────────────────────────────────────
const PLANETS=[
  {name:'Mercury',type:'Terrestrial Planet',radius:0.75,dist:14,spd:4.74,rotS:0.003,tex:TEX.mercury,
   info:{'Diameter':'4,879 km','Day':'58.6 Earth days','Year':'88 Earth days','Moons':'0','Temp':'-180 to 430°C'}},
  {name:'Venus',  type:'Terrestrial Planet',radius:1.35,dist:20,spd:1.82,rotS:-0.002,tex:TEX.venus,
   info:{'Diameter':'12,104 km','Day':'243 Earth days','Year':'225 Earth days','Moons':'0','Temp':'462°C avg'}},
  {name:'Earth',  type:'Terrestrial Planet',radius:1.5, dist:27,spd:1.00,rotS:0.005, tex:TEX.earth,atmo:new THREE.Color(0.22,0.52,1),
   info:{'Diameter':'12,742 km','Day':'24 hours','Year':'365.25 days','Moons':'1','Temp':'-88 to 58°C'}},
  {name:'Mars',   type:'Terrestrial Planet',radius:1.05,dist:36,spd:0.53,rotS:0.005, tex:TEX.mars, atmo:new THREE.Color(0.88,0.38,0.18),
   info:{'Diameter':'6,779 km','Day':'24.6 hours','Year':'687 Earth days','Moons':'2','Temp':'-153 to 20°C'}},
  {name:'Jupiter',type:'Gas Giant',          radius:5.5, dist:60,spd:0.084,rotS:0.012,tex:TEX.jupiter,
   info:{'Diameter':'139,820 km','Day':'9.9 hours','Year':'11.9 Earth years','Moons':'95','Temp':'-145°C avg'}},
  {name:'Saturn', type:'Gas Giant',          radius:4.8, dist:82,spd:0.034,rotS:0.010,tex:TEX.saturn,rings:true,
   info:{'Diameter':'116,460 km','Day':'10.7 hours','Year':'29.4 Earth years','Moons':'146','Temp':'-178°C avg'}},
  {name:'Uranus', type:'Ice Giant',          radius:3.2, dist:104,spd:0.012,rotS:0.007,tex:TEX.uranus,
   info:{'Diameter':'50,724 km','Day':'17.2 hours','Year':'84 Earth years','Moons':'27','Temp':'-224°C avg'}},
  {name:'Neptune',type:'Ice Giant',          radius:3.0, dist:128,spd:0.006,rotS:0.006,tex:TEX.neptune,
   info:{'Diameter':'49,244 km','Day':'16.1 hours','Year':'164.8 Earth years','Moons':'16','Temp':'-218°C avg'}},
];

// ── Scene ─────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.01,8000);
camera.position.set(0,58,135);

const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.045;
controls.minDistance=1.5;controls.maxDistance=800;

// Lights
scene.add(new THREE.PointLight(0xfff3d0,4,0,1.4));
scene.add(new THREE.AmbientLight(0x10101a,0.35));

// Stars
(function(){
  const n=60000,pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=1400+Math.random()*600;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);pos[i*3+2]=r*Math.cos(ph);
    const t=Math.random();col[i*3]=lerp(0.85,1,t);col[i*3+1]=lerp(0.82,1,t);col[i*3+2]=lerp(0.72,1,t);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:0.7,vertexColors:true,sizeAttenuation:true})));
})();

// Sun
const sun=new THREE.Mesh(new THREE.SphereGeometry(6,64,64),
  new THREE.MeshStandardMaterial({map:TEX.sun,emissiveMap:TEX.sun,emissive:new THREE.Color(1,0.5,0.08),emissiveIntensity:3}));
scene.add(sun);
[[1.18,0.14],[1.4,0.07],[1.78,0.034],[2.6,0.014]].forEach(([s,a])=>{
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(6*s,32,32),
    new THREE.MeshBasicMaterial({color:new THREE.Color(1,0.44,0.05),transparent:true,opacity:a,side:THREE.BackSide,depthWrite:false})));
});

// Orbit paths
for(const pd of PLANETS){
  const pts=[];
  for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*pd.dist,0,Math.sin(a)*pd.dist));}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.055})));
}

// Asteroid belt
(function(){
  const n=2200,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=lerp(41,54,Math.random());
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-0.5)*1.6;pos[i*3+2]=Math.sin(a)*r;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x887755,size:0.22,sizeAttenuation:true})));
})();

// Planets
const meshes=[],pivots=[];
for(const pd of PLANETS){
  const pivot=new THREE.Object3D();pivot.rotation.y=Math.random()*Math.PI*2;scene.add(pivot);pivots.push(pivot);
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(pd.radius,64,64),
    new THREE.MeshStandardMaterial({map:pd.tex,roughness:0.88,metalness:0}));
  mesh.position.x=pd.dist;mesh.userData=pd;pivot.add(mesh);meshes.push(mesh);
  if(pd.atmo){
    mesh.add(new THREE.Mesh(new THREE.SphereGeometry(pd.radius*1.06,32,32),
      new THREE.MeshBasicMaterial({color:pd.atmo,transparent:true,opacity:0.11,side:THREE.BackSide,depthWrite:false})));
  }
  if(pd.rings){
    const ri=pd.radius*1.28,ro=pd.radius*2.5;
    const rg=new THREE.RingGeometry(ri,ro,128);
    const p=rg.attributes.position,uv=rg.attributes.uv;
    for(let i=0;i<p.count;i++){const d=Math.sqrt(p.getX(i)**2+p.getZ(i)**2);uv.setXY(i,(d-ri)/(ro-ri),0.5);}
    const ring=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:TEX.rings,side:THREE.DoubleSide,transparent:true,opacity:0.9,depthWrite:false}));
    ring.rotation.x=Math.PI/2.15;mesh.add(ring);
  }
}

// ── Camera tween ──────────────────────────────────────────────
let zoomed=false,selected=null,tweening=false,tweenT=0;
const tFrom={pos:new THREE.Vector3(),look:new THREE.Vector3()};
const tTo={pos:new THREE.Vector3(),look:new THREE.Vector3()};
function startTween(tp,tl){tFrom.pos.copy(camera.position);tFrom.look.copy(controls.target);tTo.pos.copy(tp);tTo.look.copy(tl);tweening=true;tweenT=0;}

function zoomTo(mesh){
  selected=mesh;zoomed=true;
  const pd=mesh.userData,wp=new THREE.Vector3();mesh.getWorldPosition(wp);
  const off=pd.radius*4.5+3;
  startTween(new THREE.Vector3(wp.x+off,wp.y+off*0.38,wp.z+off),wp.clone());
  document.getElementById('info-name').textContent=pd.name;
  document.getElementById('info-type').textContent=pd.type;
  const body=document.getElementById('info-body');body.innerHTML='';
  for(const [k,v] of Object.entries(pd.info)){
    const r=document.createElement('div');r.className='irow';
    r.innerHTML=`<span class="ik">${k}</span><span class="iv">${v}</span>`;body.appendChild(r);
  }
  document.getElementById('info').classList.add('on');
  document.getElementById('back-btn').classList.add('on');
  document.getElementById('hint').style.opacity='0';
}

function resetView(){
  selected=null;zoomed=false;
  startTween(new THREE.Vector3(0,58,135),new THREE.Vector3(0,0,0));
  document.getElementById('info').classList.remove('on');
  document.getElementById('back-btn').classList.remove('on');
  document.getElementById('hint').style.opacity='1';
}

// Raycaster
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let md={x:0,y:0};
canvas.addEventListener('mousedown',e=>{md={x:e.clientX,y:e.clientY};});
canvas.addEventListener('click',e=>{
  if(Math.hypot(e.clientX-md.x,e.clientY-md.y)>5)return;
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(meshes);
  if(h.length)zoomTo(h[0].object);else if(zoomed)resetView();
});
canvas.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  canvas.style.cursor=ray.intersectObjects(meshes).length?'pointer':'grab';
});
// Touch support
canvas.addEventListener('touchstart',e=>{md={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  if(Math.hypot(t.clientX-md.x,t.clientY-md.y)>10)return;
  mouse.x=(t.clientX/innerWidth)*2-1;mouse.y=-(t.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(meshes);
  if(h.length)zoomTo(h[0].object);else if(zoomed)resetView();
});

document.getElementById('back-btn').addEventListener('click',resetView);
document.getElementById('info-x').addEventListener('click',resetView);

// Speed
let speed=1.5;
document.getElementById('speed-slider').addEventListener('input',e=>{
  speed=parseFloat(e.target.value);document.getElementById('speed-val').textContent=speed.toFixed(1)+'×';
});

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ── Loop ──────────────────────────────────────────────────────
prog(100);done();
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  for(let i=0;i<pivots.length;i++){
    pivots[i].rotation.y+=PLANETS[i].spd*0.003*speed*dt*60;
    meshes[i].rotation.y+=PLANETS[i].rotS*speed*dt*60;
  }
  sun.rotation.y+=0.001*dt*60;
  if(tweening){
    tweenT=Math.min(tweenT+dt*1.3,1);const t=eio(tweenT);
    camera.position.lerpVectors(tFrom.pos,tTo.pos,t);
    controls.target.lerpVectors(tFrom.look,tTo.look,t);
    if(tweenT>=1)tweening=false;
  }
  if(zoomed&&selected&&!tweening){
    const wp=new THREE.Vector3();selected.getWorldPosition(wp);
    const pd=selected.userData,off=pd.radius*4.5+3;
    camera.position.lerp(new THREE.Vector3(wp.x+off,wp.y+off*0.38,wp.z+off),0.05);
    controls.target.lerp(wp,0.07);
  }
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
