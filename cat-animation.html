<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat in the Garden · 8K Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
  #badge {
    position: fixed; bottom: 18px; right: 20px;
    color: rgba(255,255,255,0.35);
    font: 600 11px/1 'SF Mono', 'Fira Code', monospace;
    letter-spacing: 0.12em; text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="badge">8K · Cat Garden · Live</div>
<script>
'use strict';

// ── Canvas & DPI ────────────────────────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = W * dpr;
  cvs.height = H * dpr;
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', () => { resize(); generateGrass(); generateFlowers(); CAT.place(); });

// ── Math helpers ────────────────────────────────────────────
const PI = Math.PI, TAU = PI * 2;
const sin = Math.sin, cos = Math.cos, abs = Math.abs;
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const smooth = t => t * t * (3 - 2 * t);
const rand  = (a, b) => a + Math.random() * (b - a);
const cbez  = (p0, p1, p2, p3, t) => {
  const m = 1 - t;
  return m*m*m*p0 + 3*m*m*t*p1 + 3*m*t*t*p2 + t*t*t*p3;
};

// ── Global time & wind ──────────────────────────────────────
let T = 0, dt = 0;
let wind = 0.3, windTarget = 0.3;
function updateWind() {
  windTarget = 0.2 + 0.4 * (0.5 + 0.5 * sin(T * 0.17 + 1));
  wind += (windTarget - wind) * 0.018;
}

// ── Grass ───────────────────────────────────────────────────
class GrassBlade {
  constructor(x, y, h, rgb, wm) {
    this.x = x; this.y = y; this.h = h;
    this.rgb = rgb; this.wm = wm;
    this.ph = rand(0, TAU);
    this.fr = rand(0.7, 1.6);
    this.w  = rand(1.5, 4.5);
  }
  draw() {
    const sw = sin(T * this.fr + this.ph) * wind * this.wm * 18;
    ctx.beginPath();
    ctx.moveTo(this.x - this.w * 0.5, this.y);
    ctx.quadraticCurveTo(this.x + sw * 0.4, this.y - this.h * 0.55, this.x + sw, this.y - this.h);
    ctx.quadraticCurveTo(this.x + sw * 0.4 + this.w, this.y - this.h * 0.55, this.x + this.w * 0.5, this.y);
    ctx.fillStyle = `rgba(${this.rgb},1)`;
    ctx.fill();
  }
}

let grassLayers = [];
function generateGrass() {
  grassLayers = [];
  const defs = [
    { n: 160, yBase: 0.61, yVar: 8,  hLo: 18, hHi: 40,  rLo: '28,65,18',  rHi: '35,80,22',  wm: 0.5 },
    { n: 250, yBase: 0.67, yVar: 14, hLo: 30, hHi: 65,  rLo: '38,90,24',  rHi: '50,115,30', wm: 0.75 },
    { n: 350, yBase: 0.73, yVar: 18, hLo: 45, hHi: 90,  rLo: '50,110,30', rHi: '65,145,38', wm: 1.0 },
    { n: 300, yBase: 0.80, yVar: 22, hLo: 60, hHi: 130, rLo: '55,120,32', rHi: '75,165,45', wm: 1.3 },
  ];
  for (const d of defs) {
    const blades = [];
    for (let i = 0; i < d.n; i++) {
      const x = rand(0, W);
      const y = H * d.yBase + rand(-d.yVar, d.yVar);
      const h = rand(d.hLo, d.hHi);
      const f = Math.random();
      const rgb = f < 0.5 ? d.rLo : d.rHi;
      blades.push(new GrassBlade(x, y, h, rgb, d.wm));
    }
    blades.sort((a, b) => a.y - b.y);
    grassLayers.push(blades);
  }
}

// ── Flowers ─────────────────────────────────────────────────
class Flower {
  constructor(x, y, type, sc) {
    this.x = x; this.y = y; this.type = type; this.sc = sc;
    this.ph    = rand(0, TAU);
    this.stemH = rand(28, 65) * sc;
    this.wobble    = 0;
    this.wobbleVel = 0;
    this.totalWobble = 0;
  }

  update(pawX, pawY, pawActive) {
    this.wobbleVel += -this.wobble * 0.18 - this.wobbleVel * 0.12;
    if (pawActive) {
      const d = Math.hypot(pawX - this.x, pawY - this.y);
      if (d < 60) this.wobbleVel += (60 - d) * 0.08;
    }
    this.wobble += this.wobbleVel;
    this.wobble *= 0.93;
    this.totalWobble = this.wobble + sin(T * 1.1 + this.ph) * wind * 9;
  }

  draw() {
    const { x, y, sc, stemH } = this;
    const sw = this.totalWobble;
    ctx.save();
    ctx.translate(x, y);

    // Stem
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sw * 0.4, -stemH * 0.55, sw, -stemH);
    ctx.strokeStyle = `rgb(45,110,35)`;
    ctx.lineWidth = 2 * sc;
    ctx.stroke();

    // Leaves
    ctx.save();
    ctx.translate(sw * 0.35, -stemH * 0.45);
    ctx.rotate(0.8 + sin(T * 0.8 + this.ph) * 0.1);
    ctx.beginPath();
    ctx.ellipse(8, 0, 10 * sc, 4 * sc, 0, 0, TAU);
    ctx.fillStyle = 'rgb(50,120,35)';
    ctx.fill();
    ctx.restore();

    ctx.translate(sw, -stemH);
    if (this.type === 'daisy')      this._daisy(sc);
    else if (this.type === 'dande') this._dandelion(sc);
    else                            this._wild(sc);
    ctx.restore();
  }

  _daisy(sc) {
    const n = 14, pl = 13 * sc, pw = 4 * sc;
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.rotate(i / n * TAU + T * 0.05);
      ctx.beginPath();
      ctx.ellipse(0, -pl * 0.6, pw * 0.5, pl * 0.65, 0, 0, TAU);
      ctx.fillStyle = 'rgba(255,252,238,0.96)';
      ctx.fill();
      ctx.restore();
    }
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 7 * sc);
    cg.addColorStop(0, '#FFDF00'); cg.addColorStop(0.5, '#FF9900'); cg.addColorStop(1, '#8B4513');
    ctx.beginPath(); ctx.arc(0, 0, 7 * sc, 0, TAU);
    ctx.fillStyle = cg; ctx.fill();
  }

  _dandelion(sc) {
    const n = 28;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      const len = 11 * sc;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len * 0.65);
      ctx.strokeStyle = 'rgba(210,210,210,0.75)'; ctx.lineWidth = 0.6; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -len, 2.5 * sc, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 4 * sc, 0, TAU);
    ctx.fillStyle = '#c8a800'; ctx.fill();
  }

  _wild(sc) {
    const palette = ['#ff6b9d','#ff4081','#ab47bc','#ff7043','#42a5f5'];
    const col = palette[Math.floor(this.ph / TAU * palette.length)];
    for (let i = 0; i < 5; i++) {
      ctx.save(); ctx.rotate(i / 5 * TAU);
      ctx.beginPath(); ctx.ellipse(0, -7 * sc, 3 * sc, 7.5 * sc, 0, 0, TAU);
      ctx.fillStyle = col; ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 4 * sc, 0, TAU);
    ctx.fillStyle = '#FFD700'; ctx.fill();
  }
}

let flowers = [];
function generateFlowers() {
  flowers = [];
  const types = ['daisy','dande','wild'];
  for (let i = 0; i < 65; i++) {
    const x  = rand(W * 0.04, W * 0.96);
    const y  = rand(H * 0.59, H * 0.78);
    const tp = types[Math.floor(Math.random() * 3)];
    const sc = rand(0.7, 1.6);
    flowers.push(new Flower(x, y, tp, sc));
  }
  flowers.sort((a, b) => a.y - b.y);
}

// ── Cat ─────────────────────────────────────────────────────
const CAT = {
  x: 0, y: 0, sc: 1,
  state: 'idle', stateTimer: 0, stateDur: 3,
  breathPh: 0, tailPh: 0,
  blinkTimer: 3, blinking: false, blinkProg: 0,
  pawExtend: 0, pawX: 0, pawY: 0,
  targetFlower: null,

  place() { this.x = W * 0.46; this.y = H * 0.73; this.sc = clamp(H / 700, 0.8, 1.5); },

  update() {
    this.breathPh += dt * 0.75;
    this.tailPh   += dt * 1.4;
    this.stateTimer += dt;

    // Blink
    this.blinkTimer -= dt;
    if (this.blinkTimer <= 0 && !this.blinking) {
      this.blinking = true; this.blinkProg = 0;
      this.blinkTimer = rand(1.8, 5.5);
    }
    if (this.blinking) {
      this.blinkProg += dt * 9;
      if (this.blinkProg >= 1) { this.blinking = false; this.blinkProg = 0; }
    }

    // State machine
    if (this.stateTimer >= this.stateDur) this._nextState();

    // Find nearby flower
    if (!this.targetFlower || Math.random() < 0.003) {
      let best = null, bestD = Infinity;
      for (const f of flowers) {
        const d = Math.abs(f.x - this.x);
        if (d < W * 0.28 && d < bestD) { bestD = d; best = f; }
      }
      this.targetFlower = best;
    }

    // Paw physics
    const prog = this.stateTimer / this.stateDur;
    if (this.state === 'swipe' && this.targetFlower) {
      this.pawExtend = Math.sin(prog * PI);
      const dx = this.targetFlower.x - this.x;
      const dy = this.targetFlower.y - this.y;
      this.pawX = this.x + dx * this.pawExtend * 0.65;
      this.pawY = this.y - 18 * this.sc + dy * 0.15;
    } else {
      this.pawExtend = 0;
    }

    // Update flowers
    const pawActive = this.state === 'swipe' && this.pawExtend > 0.45;
    for (const f of flowers) f.update(this.pawX, this.pawY, pawActive);
  },

  _nextState() {
    this.stateTimer = 0;
    const pool = ['idle','idle','idle','idle','crouch','swipe','swipe','sniff'];
    this.state    = pool[Math.floor(Math.random() * pool.length)];
    this.stateDur = rand(2.5, 5.5);
  },

  draw() {
    const { x, y, sc, state, stateTimer, stateDur, breathPh, tailPh } = this;
    const prog   = stateTimer / stateDur;
    const breath = sin(breathPh) * 2.2;

    let crouch = 0, bodyTilt = 0, headTilt = 0;
    if (state === 'idle')   { bodyTilt = sin(T * 0.28) * 2; headTilt = sin(T * 0.45) * 6; }
    if (state === 'crouch') { crouch = smooth(clamp(prog * 2, 0, 1)) * 22; bodyTilt = -6; headTilt = -12; }
    if (state === 'swipe')  { crouch = 18; bodyTilt = -9; headTilt = -16; }
    if (state === 'sniff')  { headTilt = 22 * smooth(clamp(prog * 2, 0, 1)); }

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);

    // Shadow
    const shY = 125 - crouch;
    ctx.save();
    ctx.translate(0, shY);
    ctx.scale(1, 0.22);
    const sg = ctx.createRadialGradient(0,0,0,0,0,95);
    sg.addColorStop(0, 'rgba(0,0,0,0.38)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(0, 0, 95, 95, 0, 0, TAU); ctx.fill();
    ctx.restore();

    // Tail (behind body)
    this._tail(tailPh, crouch);

    // Body
    const bY = -crouch * 0.45;
    ctx.save();
    ctx.translate(0, bY);
    ctx.rotate(bodyTilt * PI / 180);

    const bg = ctx.createRadialGradient(-12, -18, 8, 0, 0, 68);
    bg.addColorStop(0, '#FFA040'); bg.addColorStop(0.55, '#E07020'); bg.addColorStop(1, '#B84E10');
    ctx.beginPath(); ctx.ellipse(0, 0, 56 + breath * 0.3, 46 + breath * 0.5, -0.1, 0, TAU);
    ctx.fillStyle = bg; ctx.fill();

    // Belly highlight
    const belly = ctx.createRadialGradient(0, 18, 4, 0, 12, 38);
    belly.addColorStop(0, 'rgba(255,225,185,0.82)'); belly.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.beginPath(); ctx.ellipse(0, 18, 32, 30, 0, 0, TAU);
    ctx.fillStyle = belly; ctx.fill();

    // Tabby body stripes
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = '#7A2E00'; ctx.lineWidth = 4.5;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 13 - 4, -38);
      ctx.quadraticCurveTo(i * 13 + 5, -8, i * 11, 22);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Legs / paws
    if (state === 'swipe') {
      const pe = sin(prog * PI);
      ctx.save();
      ctx.translate(-28 + pe * 65, 42 - pe * 22);
      ctx.rotate(pe * 0.55);
      this._paw(0, 0, true);
      ctx.restore();
      this._paw(22, 62, false);
    } else {
      this._paw(-22, 62, false);
      this._paw(22, 62, false);
    }

    // Hind leg hint
    ctx.beginPath(); ctx.ellipse(-42, 35, 16, 12, 0.5, 0, TAU);
    ctx.fillStyle = '#C06018'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(42, 35, 16, 12, -0.5, 0, TAU);
    ctx.fillStyle = '#C06018'; ctx.fill();

    ctx.restore(); // body

    // Head
    const hY = bY - 78 - crouch * 0.28 + breath;
    ctx.save();
    ctx.translate(0, hY);
    ctx.rotate(headTilt * PI / 180);

    const hg = ctx.createRadialGradient(-9, -6, 5, 0, 0, 40);
    hg.addColorStop(0, '#FFA045'); hg.addColorStop(0.68, '#E07020'); hg.addColorStop(1, '#C05010');
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU);
    ctx.fillStyle = hg; ctx.fill();

    // Tabby M forehead
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = '#7A2E00'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16,-21); ctx.lineTo(-8,-32); ctx.lineTo(0,-22); ctx.lineTo(8,-32); ctx.lineTo(16,-21);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13,-14); ctx.quadraticCurveTo(0,-10,13,-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11,-7);  ctx.quadraticCurveTo(0,-4, 11,-7);  ctx.stroke();
    ctx.globalAlpha = 1;

    // Cheeks
    for (const sx of [-1,1]) {
      const cg = ctx.createRadialGradient(sx*22,12,0,sx*22,12,20);
      cg.addColorStop(0,'rgba(255,205,155,0.65)'); cg.addColorStop(1,'rgba(255,155,100,0)');
      ctx.beginPath(); ctx.arc(sx*22,12,20,0,TAU); ctx.fillStyle=cg; ctx.fill();
    }

    // Ears
    this._ear(-26, -33, -0.28);
    this._ear( 26, -33,  0.28);

    // Eyes
    const bs = this.blinking ? sin(clamp(this.blinkProg,0,1) * PI) : 0;
    this._eye(-15, -5, bs);
    this._eye( 15, -5, bs);

    // Nose
    ctx.beginPath(); ctx.moveTo(-4,9); ctx.lineTo(4,9); ctx.lineTo(0,14); ctx.closePath();
    ctx.fillStyle = '#FF6B8A'; ctx.fill();

    // Mouth
    ctx.strokeStyle='#B83860'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(0,14); ctx.quadraticCurveTo(-7,20,-9,17); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,14); ctx.quadraticCurveTo(7,20,9,17);   ctx.stroke();

    // Chin
    const chg = ctx.createRadialGradient(0,22,0,0,22,18);
    chg.addColorStop(0,'rgba(255,235,205,0.72)'); chg.addColorStop(1,'rgba(255,185,135,0)');
    ctx.beginPath(); ctx.ellipse(0,23,17,14,0,0,TAU); ctx.fillStyle=chg; ctx.fill();

    // Whiskers
    this._whiskers();

    ctx.restore(); // head
    ctx.restore(); // main
  },

  _ear(x, y, tilt) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    const eg = ctx.createLinearGradient(0,-22,0,6);
    eg.addColorStop(0,'#C04C0E'); eg.addColorStop(1,'#E06818');
    ctx.beginPath(); ctx.moveTo(-13,6); ctx.lineTo(0,-24); ctx.lineTo(13,6); ctx.closePath();
    ctx.fillStyle=eg; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-7,4); ctx.lineTo(0,-15); ctx.lineTo(7,4); ctx.closePath();
    ctx.fillStyle='rgba(255,148,180,0.82)'; ctx.fill();
    ctx.restore();
  },

  _eye(x, y, blinkSc) {
    ctx.save(); ctx.translate(x, y);
    ctx.save(); ctx.scale(1, 1 - blinkSc * 0.88);

    // Sclera
    ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,TAU);
    ctx.fillStyle='rgba(242,238,222,0.96)'; ctx.fill();

    // Iris
    const ig = ctx.createRadialGradient(0,0,0,0,0,6);
    ig.addColorStop(0,'#3DBB5A'); ig.addColorStop(0.4,'#1A7030');
    ig.addColorStop(0.8,'#0A4A1C'); ig.addColorStop(1,'#001808');
    ctx.beginPath(); ctx.arc(0,0,6,0,TAU); ctx.fillStyle=ig; ctx.fill();

    // Pupil - vertical slit
    ctx.beginPath(); ctx.ellipse(0,0,1.6,5.5,0,0,TAU);
    ctx.fillStyle='#000'; ctx.fill();

    // Highlights
    ctx.beginPath(); ctx.arc(-2,-2,2.2,0,TAU); ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fill();
    ctx.beginPath(); ctx.arc(3,1.5,1.1,0,TAU); ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();

    ctx.restore();

    // Eyelid
    if (blinkSc > 0) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,TAU); ctx.clip();
      ctx.fillStyle='#DF6C1A';
      ctx.fillRect(-12, -8 - (1-blinkSc)*3, 24, 16 + blinkSc*6);
      ctx.restore();
    }

    // Outline
    ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,TAU);
    ctx.strokeStyle='rgba(80,30,0,0.5)'; ctx.lineWidth=1.2; ctx.stroke();

    ctx.restore();
  },

  _whiskers() {
    ctx.strokeStyle='rgba(255,255,255,0.88)'; ctx.lineWidth=1.1;
    for (const s of [-1,1]) {
      for (let i = -1; i <= 1; i++) {
        ctx.save(); ctx.translate(s*6, 10 + i*4.5);
        ctx.rotate((i*0.12 + s*0.28)*s);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*38, i*2.5); ctx.stroke();
        ctx.restore();
      }
    }
    // Brow whiskers
    ctx.lineWidth=0.9; ctx.strokeStyle='rgba(255,255,255,0.55)';
    for (const s of [-1,1]) {
      ctx.beginPath(); ctx.moveTo(s*10,-19); ctx.lineTo(s*26,-24); ctx.stroke();
    }
  },

  _paw(x, y, extended) {
    ctx.save(); ctx.translate(x, y);
    const pg = ctx.createRadialGradient(0,0,0,0,0,14);
    pg.addColorStop(0,'#FF9845'); pg.addColorStop(1,'#C26022');
    ctx.beginPath(); ctx.ellipse(0,0, extended?15:12, extended?11:9, 0,0,TAU);
    ctx.fillStyle=pg; ctx.fill();
    // Toes
    for (const [tx,ty] of [[-5.5,-5],[0,-7],[5.5,-5]]) {
      ctx.beginPath(); ctx.ellipse(tx,ty,4,3.2,0,0,TAU);
      ctx.fillStyle='#FFB885'; ctx.fill();
    }
    // Claws
    if (extended) {
      ctx.strokeStyle='rgba(255,245,225,0.85)'; ctx.lineWidth=1.5;
      for (const [tx,ty] of [[-5.5,-5],[0,-7],[5.5,-5]]) {
        ctx.beginPath(); ctx.moveTo(tx,ty-3); ctx.lineTo(tx,ty-10); ctx.stroke();
      }
    }
    ctx.restore();
  },

  _tail(ph, crouch) {
    const bx = 52, by = -crouch * 0.3;
    const cpx1 = bx + 85, cpy1 = by - 55 + sin(ph * 0.48)*25;
    const tipX  = bx + 55 + sin(ph)*52, tipY = by - 110 + sin(ph*0.7)*38;
    const cpx2  = tipX - 25, cpy2 = tipY + 35;

    for (let i = 0; i < 32; i++) {
      const t0 = i / 32, t1 = (i+1) / 32;
      const x0 = cbez(bx,cpx1,cpx2,tipX,t0), y0 = cbez(by,cpy1,cpy2,tipY,t0);
      const x1 = cbez(bx,cpx1,cpx2,tipX,t1), y1 = cbez(by,cpy1,cpy2,tipY,t1);
      const thick = lerp(19, 6, t0);
      const dx = x1-x0, dy = y1-y0, L = Math.hypot(dx,dy)||1;
      const nx = -dy/L, ny = dx/L;
      const dark = Math.floor(t0*9) % 2 === 0;
      ctx.beginPath();
      ctx.moveTo(x0+nx*thick, y0+ny*thick);
      ctx.lineTo(x0-nx*thick, y0-ny*thick);
      ctx.lineTo(x1-nx*(thick-1), y1-ny*(thick-1));
      ctx.lineTo(x1+nx*(thick-1), y1+ny*(thick-1));
      ctx.closePath();
      ctx.fillStyle = dark ? '#B84C10' : '#FF8E3C';
      ctx.fill();
    }
    // Tip
    const tg = ctx.createRadialGradient(tipX,tipY,0,tipX,tipY,9);
    tg.addColorStop(0,'#FFFAF0'); tg.addColorStop(1,'#E0A060');
    ctx.beginPath(); ctx.arc(tipX,tipY,8,0,TAU); ctx.fillStyle=tg; ctx.fill();
  }
};

// ── Particles ────────────────────────────────────────────────
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(0, W); this.y = rand(H * 0.42, H * 0.78);
    this.vx = rand(-0.4, 0.4); this.vy = rand(-0.85, -0.18);
    this.sz = rand(1, 4.5); this.life = 1;
    this.decay = rand(0.003, 0.009);
    this.petal = Math.random() < 0.45;
    this.r = this.petal ? rand(220,255) : 255;
    this.g = this.petal ? rand(100,200) : rand(205,255);
    this.b = this.petal ? rand(150,255) : rand(30,80);
    this.rot = rand(0,TAU); this.rotV = rand(-0.06,0.06);
  }
  update() {
    this.vx += (wind*0.45 - this.vx) * 0.025;
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.012;
    this.rot += this.rotV;
    this.life -= this.decay;
    if (this.life <= 0 || this.y < 0 || this.x < 0 || this.x > W) this.reset();
  }
  draw() {
    const a = this.life * 0.7;
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    ctx.globalAlpha = a;
    ctx.beginPath();
    if (this.petal) ctx.ellipse(0, 0, this.sz, this.sz*2.2, 0, 0, TAU);
    else            ctx.arc(0, 0, this.sz, 0, TAU);
    ctx.fillStyle = `rgb(${this.r},${this.g},${this.b})`;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

const particles = Array.from({length: 90}, () => new Particle());

// ── Scene drawing ────────────────────────────────────────────
function drawBG() {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.72);
  sky.addColorStop(0,   '#0D2A5E');
  sky.addColorStop(0.28,'#2B4F9C');
  sky.addColorStop(0.58,'#D96C28');
  sky.addColorStop(0.8, '#FFAA3C');
  sky.addColorStop(1,   '#FFD478');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Sun glow
  const sx = W * 0.74, sy = H * 0.20;
  const sun = ctx.createRadialGradient(sx, sy, 0, sx, sy, 200);
  sun.addColorStop(0,   'rgba(255,255,210,0.95)');
  sun.addColorStop(0.14,'rgba(255,225,110,0.75)');
  sun.addColorStop(0.38,'rgba(255,145,45,0.3)');
  sun.addColorStop(1,   'rgba(255,100,0,0)');
  ctx.beginPath(); ctx.arc(sx, sy, 200, 0, TAU);
  ctx.fillStyle = sun; ctx.fill();
  ctx.beginPath(); ctx.arc(sx, sy, 26, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,220,0.97)'; ctx.fill();

  // God rays
  ctx.globalAlpha = 0.07;
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU + T * 0.018;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-22,520); ctx.lineTo(22,520); ctx.closePath();
    ctx.fillStyle = '#FFE070'; ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Far hill
  ctx.globalAlpha = 0.48;
  ctx.beginPath(); ctx.moveTo(0, H * 0.72);
  for (let x = 0; x <= W; x += 25) {
    const y = H * 0.56 + sin(x*0.007+1.4)*48 + sin(x*0.003)*65;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const hg1 = ctx.createLinearGradient(0, H*0.5, 0, H*0.72);
  hg1.addColorStop(0,'#25582E'); hg1.addColorStop(1,'#183A1E');
  ctx.fillStyle = hg1; ctx.fill();
  ctx.globalAlpha = 1;

  // Near hill
  ctx.globalAlpha = 0.68;
  ctx.beginPath(); ctx.moveTo(0, H * 0.75);
  for (let x = 0; x <= W; x += 18) {
    const y = H * 0.635 + sin(x*0.009+0.6)*32 + sin(x*0.004+2)*42;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const hg2 = ctx.createLinearGradient(0, H*0.60, 0, H*0.78);
  hg2.addColorStop(0,'#387038'); hg2.addColorStop(1,'#1E4420');
  ctx.fillStyle = hg2; ctx.fill();
  ctx.globalAlpha = 1;
}

function drawGround() {
  const gg = ctx.createLinearGradient(0, H*0.63, 0, H);
  gg.addColorStop(0,'#4A8840'); gg.addColorStop(0.35,'#3A7030'); gg.addColorStop(1,'#1A4018');
  ctx.fillStyle = gg; ctx.fillRect(0, H*0.62, W, H*0.38);
}

function drawVignette() {
  const vg = ctx.createRadialGradient(W/2, H*0.48, H*0.18, W/2, H*0.5, H*0.82);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,25,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// ── Animation loop ───────────────────────────────────────────
let last = 0;
function frame(ts) {
  dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  T = ts / 1000;

  updateWind();
  CAT.update();

  ctx.clearRect(0, 0, W, H);

  drawBG();
  drawGround();

  // Back grass layers (0,1)
  grassLayers[0].forEach(b => b.draw());
  grassLayers[1].forEach(b => b.draw());

  // Flowers behind cat
  for (const f of flowers) if (f.y < CAT.y - 20) f.draw();

  // Cat
  CAT.draw();

  // Flowers in front
  for (const f of flowers) if (f.y >= CAT.y - 20) f.draw();

  // Front grass (2,3)
  grassLayers[2].forEach(b => b.draw());
  grassLayers[3].forEach(b => b.draw());

  // Particles
  for (const p of particles) { p.update(); p.draw(); }

  drawVignette();

  requestAnimationFrame(frame);
}

// ── Init ─────────────────────────────────────────────────────
generateGrass();
generateFlowers();
CAT.place();
requestAnimationFrame(frame);
</script>
