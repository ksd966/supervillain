<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" fill="none">
  <defs>
    <clipPath id="arc-clip">
      <rect x="0" y="0" width="320" height="180"/>
    </clipPath>
    <linearGradient id="gold-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AA38"/>
      <stop offset="100%" stop-color="#A07E1A"/>
    </linearGradient>
    <linearGradient id="gold-dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8932A"/>
      <stop offset="100%" stop-color="#8A6A14"/>
    </linearGradient>
  </defs>

  <!-- Double arcs -->
  <circle cx="160" cy="180" r="164" stroke="#C4982A" stroke-width="1.8" clip-path="url(#arc-clip)"/>
  <circle cx="160" cy="180" r="147" stroke="#C4982A" stroke-width="1.1" clip-path="url(#arc-clip)"/>

  <!-- Left skyline -->
  <g fill="#B0881E">
    <rect x="10"  y="158" width="11" height="22"/>
    <rect x="23"  y="150" width="9"  height="30"/>
    <!-- building with dome -->
    <rect x="34"  y="144" width="12" height="36"/>
    <ellipse cx="40" cy="144" rx="7" ry="5"/>
    <!-- tallest left -->
    <rect x="48"  y="132" width="9"  height="48"/>
    <rect x="59"  y="140" width="8"  height="40"/>
    <rect x="69"  y="148" width="10" height="32"/>
    <rect x="81"  y="155" width="8"  height="25"/>
    <rect x="91"  y="145" width="11" height="35"/>
    <rect x="104" y="150" width="9"  height="30"/>
    <rect x="115" y="158" width="10" height="22"/>
  </g>

  <!-- Right skyline (mirror) -->
  <g fill="#B0881E">
    <rect x="195" y="158" width="10" height="22"/>
    <rect x="207" y="150" width="9"  height="30"/>
    <rect x="218" y="145" width="11" height="35"/>
    <rect x="231" y="155" width="8"  height="25"/>
    <rect x="241" y="148" width="10" height="32"/>
    <rect x="253" y="140" width="8"  height="40"/>
    <!-- tallest right -->
    <rect x="263" y="132" width="9"  height="48"/>
    <!-- building with dome -->
    <rect x="274" y="144" width="12" height="36"/>
    <ellipse cx="280" cy="144" rx="7" ry="5"/>
    <rect x="288" y="150" width="9"  height="30"/>
    <rect x="299" y="158" width="11" height="22"/>
  </g>

  <!-- Ground line -->
  <line x1="10" y1="180" x2="310" y2="180" stroke="#9A7820" stroke-width="0.8" opacity="0.45"/>

  <!-- ====== EIFFEL TOWER (center x=160, base y=180) ====== -->
  <g fill="#C9A030">
    <!-- Antenna tip -->
    <polygon points="160,12 163,24 157,24"/>
    <!-- Antenna shaft -->
    <rect x="159" y="24" width="2" height="12"/>

    <!-- Top section -->
    <polygon points="159,28 161,28 165.5,54 154.5,54"/>

    <!-- Platform 1 -->
    <rect x="152" y="54" width="16" height="3.5"/>

    <!-- Upper-mid section -->
    <polygon points="154.5,57.5 165.5,57.5 170.5,80 149.5,80"/>

    <!-- Platform 2 -->
    <rect x="147" y="80" width="26" height="4"/>

    <!-- Lower section (above legs) -->
    <polygon points="149.5,84 170.5,84 179,112 141,112"/>

    <!-- Cross braces in lower section -->
    <rect x="142" y="93"  width="36" height="1.4" opacity="0.55"/>
    <rect x="141" y="102" width="38" height="1.4" opacity="0.55"/>

    <!-- Left leg -->
    <polygon points="141,112 152,112 148,180 132,180"/>

    <!-- Right leg -->
    <polygon points="168,112 179,112 188,180 172,180"/>

    <!-- Base bar -->
    <rect x="130" y="177" width="60" height="3.5"/>

    <!-- Decorative cross-brace in legs -->
    <line x1="133" y1="148" x2="150" y2="132" stroke="#C9A030" stroke-width="1.2" opacity="0.6"/>
    <line x1="170" y1="132" x2="187" y2="148" stroke="#C9A030" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Arch between tower legs -->
  <path d="M148,180 Q160,162 172,180" fill="none" stroke="#C9A030" stroke-width="1.2" opacity="0.7"/>

  <!-- ====== VIGO text ====== -->
  <text x="160" y="238"
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="62" font-weight="600"
    fill="#C4982A" text-anchor="middle" letter-spacing="6">VIGO</text>

  <!-- TRANSFERS text -->
  <text x="160" y="266"
    font-family="Space Grotesk, system-ui, sans-serif"
    font-size="13" font-weight="400"
    fill="#9A7820" text-anchor="middle" letter-spacing="9">TRANSFERS</text>
</svg>
